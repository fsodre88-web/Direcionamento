<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #f4f4f9;
            color: #4B4C6A;
            text-align: center;
            padding: 20px;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 4px solid #e0e0e8;
            border-top-color: #ff0082;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        a { color: #ff0082; }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <p id="status">Abrindo em uma nova aba...</p>
    <p id="fallback" style="display:none; margin-top: 20px;">
        Não abriu automaticamente? <a id="fallback-link" href="#" target="_blank" rel="noopener noreferrer">Clique aqui</a>.
    </p>

    <script>
        // Lê o parâmetro ?to= da URL, ex: ?to=https://www.instagram.com/algo
        const params = new URLSearchParams(window.location.search);
        const destino = params.get('to');

        if (destino) {
            document.getElementById('fallback-link').href = destino;

            // Pequeno delay para garantir que esta página já "existe" como
            // navegação independente antes de abrir o destino.
            setTimeout(function () {
                const novaAba = window.open(destino, '_blank', 'noopener,noreferrer');
                if (novaAba) {
                    document.getElementById('status').textContent = 'Pronto! Você já pode fechar esta aba.';
                } else {
                    // Pop-up bloqueado pelo navegador: mostra o link manual
                    document.getElementById('status').textContent = 'Não foi possível abrir automaticamente.';
                    document.getElementById('fallback').style.display = 'block';
                }
            }, 150);
        } else {
            document.getElementById('status').textContent = 'Nenhum destino informado.';
        }
    </script>
</body>
</html>
