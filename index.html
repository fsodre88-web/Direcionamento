<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #f4f4f9;
            color: #4B4C6A;
            text-align: center;
            padding: 20px;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 4px solid #e0e0e8;
            border-top-color: #ff0082;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        a { color: #ff0082; }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <p>Redirecionando, aguarde...</p>
    <p id="fallback" style="display:none; margin-top: 20px;">
        Não foi redirecionado automaticamente? <a id="fallback-link" href="#">Clique aqui</a>.
    </p>

    <script>
        // Lê o parâmetro ?to= da URL, ex: redirect.html?to=https://www.instagram.com/algo
        const params = new URLSearchParams(window.location.search);
        const destino = params.get('to');

        if (destino) {
            document.getElementById('fallback-link').href = destino;
            // Pequeno delay para garantir que esta página já "existe" como
            // navegação independente antes de redirecionar de novo.
            setTimeout(function () {
                window.location.replace(destino);
            }, 150);

            // Se em 3s ainda estiver aqui, mostra o link manual
            setTimeout(function () {
                document.getElementById('fallback').style.display = 'block';
            }, 3000);
        } else {
            document.querySelector('p').textContent = 'Nenhum destino informado.';
        }
    </script>
</body>
</html>
